<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Memo App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Memo App</h1>

    <button id="trainButton">
        再学習
    </button>

    <p id="trainResult"></p>

    <div class="memo-form">

        <input type="hidden" id="editingMemoId">

    <input
        id="memoTitle"
        type="text"
        placeholder="タイトル"
    >

    <textarea
        id="memoContent"
        placeholder="本文を入力してください">
    </textarea>

    <div>
        <label for="categorySelect">
            カテゴリ
        </label>

        <select id="categorySelect"></select>

        <button id="newCategoryButton">
            新しいカテゴリ
        </button>
    </div>

    <button id="predictButton">
        自動分類
    </button>

    <button id="saveButton">
        保存
    </button>

    <button id="cancelEditButton">
        編集キャンセル
    </button>

    <h2>メモ一覧</h2>
    <select id="filterCategory">
        <option value="">すべて</option>
    </select>
    <input
        id="searchKeyword"
        type="text"
        placeholder="メモを検索"
    >
    <button id="searchButton">
        検索
    </button>

    <ul id="memoList"></ul>

    </div>


    <script src="script.js"></script>

</body>

</html>
